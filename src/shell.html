<title>선택과목 상담일지 작성 도우미</title>
<style>
/*@@CSS@@*/
</style>
</head>
<body>
<header id="hdr">
  <div class="brand">
    <div class="ttl"><h1 id="app-title">선택과목 상담일지 작성 도우미</h1><button type="button" id="app-school" class="school-badge empty">학교명 입력</button></div>
    <span class="sub" id="app-sub">교육과정을 불러오면 상담을 시작할 수 있습니다</span>
  </div>
  <div class="right">
    <div class="vw">
      <button class="hbtn" id="b-view" aria-haspopup="menu" aria-expanded="false" title="글자 크기 · 이름 가리기 · 발표 모드">보기 ▾</button>
      <div id="view-menu" class="hide" role="menu">
        <div class="vm-row"><span class="vm-k">글자 크기</span><div class="seg" id="zoom-seg"><button type="button" data-z="100">100%</button><button type="button" data-z="115">115%</button><button type="button" data-z="130">130%</button></div></div>
        <label class="vm-row"><span class="vm-k">학생 이름 가리기<small>화면·인쇄만 「김○○」, 엑셀·백업은 실명</small></span><input type="checkbox" class="sw" id="vm-mask"></label>
        <button type="button" class="btn vm-btn hide-m" id="b-present">발표 모드 (크게 + 전체 화면)</button>
      </div>
    </div>
    <button class="hbtn" id="b-priv" title="엑셀 백업 · 이 PC에 남은 기록 지우기 · 백업으로 되살리기">🔒<span class="lbl"> 백업·지우기</span></button>
    <button class="hbtn st-btn st-no" id="b-link"><span class="st-dot"></span><span class="st-tx"><b class="st-t">파일에 저장 연결</b><small class="st-s" id="save-ind">아직 저장 전</small></span></button>
  </div>
</header>
<nav id="tabs">
  <button class="tab on" data-tab="counsel">💬 상담하기</button>
  <button class="tab" data-tab="student">🎓 학생별 기록</button>
  <button class="tab" data-tab="list">📋 상담 목록</button>
  <button class="tab" data-tab="sheet">🗂️ 선택 현황표</button>
  <button class="tab" data-tab="check">✅ 검증 결과</button>
  <button class="tab" data-tab="grade">🏫 학년 현황</button>
  <button class="tab" data-tab="cur">⚙️ 교육과정 설정</button>
  <button class="tab" data-tab="help">📘 간단 사용법</button>
</nav>
<div id="banner" class="hide"></div>
<main id="main"><div class="page" id="page"></div></main>
<div id="dim" class="hide"></div>
<div id="toast" class="hide"></div>
<div id="print"></div>
<input type="file" id="f-cur" accept=".xlsx,.xlsm,.xls" class="hide">
<input type="file" id="f-db" accept=".xlsx,.xlsm" class="hide">
<input type="file" id="f-merge" accept=".html,.htm,.xlsx,.xlsm" multiple class="hide">
<input type="file" id="f-self" accept=".html,.htm" class="hide">
<input type="file" id="f-restore" accept=".xlsx" class="hide">
<input type="file" id="f-pick" accept=".xlsx,.xlsm,.xls" class="hide">

<script id="J-MASTER" type="application/json">/*@@MASTER@@*/</script>
<script id="J-CUR" type="application/json">/*@@CUR@@*/</script>
<script id="J-DB" type="application/json">/*@@DB@@*/</script>
<script>
/*@@EXCELJS@@*/
</script>
<script>
/*@@APP@@*/
</script>
</body>
</html>
